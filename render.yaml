services:
  - type: web
    name: evidenceiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: APP_NAME
        value: EvidenceIQ
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://tksjbzahaxsymncnhjnu.supabase.co
      - key: CORS_ORIGINS
        value: https://evidenceiq-frontend.onrender.com
      - key: PUBMED_API_BASE
        value: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: evidenceiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://evidenceiq-backend.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://tksjbzahaxsymncnhjnu.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
